name: build carts

# Builds every example and every game as .wasc carts, runs each one headless
# on the wasmcart Node host, and uploads the carts: as a workflow artifact on
# every run, and attached to the release when a tag is pushed.
#
# The engine is NOT built here. wasmcart-defold publishes the two cart engines
# (GL and WebGPU) and the SDK that relinks them with native extensions on each
# of its releases, and this job takes them from the release that engine.lock
# names, so a cart here is built against a known engine and the two repos
# move together on purpose.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  # The release step attaches the carts to the release for the pushed tag.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # bob.jar is compiled for Java 25 (class-file major version 69).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The carts render through native-gles, which links libEGL and libGLESv2
      # and needs Mesa's software rasterizer because the runner has no GPU.
      - name: Install the software GL stack
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgles2 libglvnd0 libgl1-mesa-dri libglx-mesa0 libgbm1 rsync zip unzip

      - name: Read the engine pin
        id: engine
        run: |
          set -euo pipefail
          tag=$(sed -n 's/^wasmcart-defold *= *//p' engine.lock | tr -d ' ')
          [ -n "$tag" ] || { echo "::error::engine.lock names no wasmcart-defold release"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "engine: wasmcart-defold $tag"

      # Both engines and the SDK come from that release, checksummed against
      # the SHA256SUMS the release carries.
      - name: Fetch the engines and the SDK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.engine.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p engine
          gh release download "$TAG" --repo wasmcart/wasmcart-defold --dir engine \
            --pattern 'dmengine_wasmcart.wasm' --pattern 'dmengine_wasmcart_webgpu.wasm' \
            --pattern 'wasmcart-defold-sdk.tar.gz' --pattern 'SHA256SUMS'
          (cd engine && sha256sum -c --ignore-missing SHA256SUMS)
          tar -xzf engine/wasmcart-defold-sdk.tar.gz -C engine
          ls engine engine/wasmcart-defold-sdk
          {
            echo "ENGINE_DIR=$GITHUB_WORKSPACE/engine"
            echo "WASMCART_DEFOLD_SDK=$GITHUB_WORKSPACE/engine/wasmcart-defold-sdk"
          } >> "$GITHUB_ENV"

      # Native extensions are compiled with the emsdk the engine was built
      # with; the SDK names it and link.mjs refuses any other.
      - name: Install the Emscripten SDK the engine was built with
        run: |
          set -euo pipefail
          ver=$(node -e "console.log(require('$WASMCART_DEFOLD_SDK/sdk.json').emscripten)")
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$ver"
          "$HOME/emsdk/emsdk" activate "$ver"
          echo "WASMCART_EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$HOME/emsdk/.emscripten" >> "$GITHUB_ENV"

      # bob.jar is ~230 MB and pinned to the engine's Defold release; cache it.
      - name: Cache Defold bob.jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/wasmcart-defold
          key: bob-${{ hashFiles('tools/build-cart.mjs') }}

      - name: Install the packer and host
        run: npm install --no-save --no-audit --no-fund wasmcart

      # Fail fast with a reason if the runner cannot make a GL context at all.
      - name: Check GL works on this runner
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
        run: node tools/gl-probe.mjs

      - name: Fetch the games at their pinned commits
        run: node tools/fetch-games.mjs

      - name: Build every cart
        run: |
          set -euo pipefail
          failed=''
          for p in $(node tools/list-carts.mjs); do
            echo "::group::build $p"
            node tools/build-cart.mjs "$p" || failed="$failed $p"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::carts failed to build:$failed"
            exit 1
          fi

      # A .wasc that packs but does not run is not a pass. Step each GL cart
      # and require the runtime's own "ran N frames" line. The WebGPU carts
      # are packed but not run: the runner has no WebGPU device.
      - name: Run every GL cart headless
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
        run: |
          set -uo pipefail
          bad=''
          for p in $(node tools/list-carts.mjs); do
            name=$(basename "$p")
            cart="$p/$name.wasc"
            if [ "$(node tools/list-carts.mjs --runs "$p")" != yes ]; then
              echo "skipping the run of $name (game.json ci.run is false; see its ci.reason)"
              continue
            fi
            frames=$(node tools/list-carts.mjs --frames "$p")
            echo "::group::run $name ($frames frames)"
            out=$(npx --no-install wasmcart "$cart" --frames "$frames" 2>&1 || true)
            printf '%s\n' "$out" | grep -vE 'maxDynamic' | tail -30
            if ! printf '%s\n' "$out" | grep -qE "^ran $frames frames"; then
              bad="$bad $name(no-run)"
            fi
            printf '%s\n' "$out" | grep -qE 'ERROR:SCRIPT|cart trapped' && bad="$bad $name"
            printf '%s\n' "$out" | grep -qE '[0-9]+ PASS +[1-9][0-9]* FAIL' && bad="$bad $name(assertions)"
            echo "::endgroup::"
          done
          if [ -n "$bad" ]; then
            echo "::error::carts failed at runtime:$bad"
            exit 1
          fi

      - name: Collect the carts
        run: |
          set -euo pipefail
          mkdir -p dist
          for p in $(node tools/list-carts.mjs); do cp "$p"/*.wasc dist/; done
          (cd dist && sha256sum ./*.wasc > SHA256SUMS)
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: carts
          path: dist/
          retention-days: 30

      # A pushed tag gets a release carrying every cart, so a version can be
      # pinned and downloaded without a GitHub account.
      - name: Attach the carts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" dist/*.wasc dist/SHA256SUMS --clobber
